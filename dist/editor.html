<script type="module">
const byId=id=>document.getElementById(id), input=byId('pass'),submit=byId('submit'),status=byId('message'),show=byId('show');
const envelope=JSON.parse(byId('envelope').textContent);
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function makeRotatedEditor(lockedPage, oldEnvelope, clearPayload, newPassword){
  if(newPassword.length<8||newPassword!==newPassword.trim())throw new Error('새 암호는 앞뒤 공백 없이 8자 이상 입력해 주세요.');
  const marker=/<script type="application\/json" id="envelope">([^<]+)<\/script>/g;
  const matches=[...lockedPage.matchAll(marker)];
  if(matches.length!==1)throw new Error('원본 편집기 파일을 확인할 수 없습니다.');
  const m=matches[0],live=JSON.parse(m[1]);
  if(['salt','iv','cipher'].some(k=>oldEnvelope[k]!==live[k]))throw new Error('홈페이지의 편집기 버전이 바뀌었습니다. 새로고침 후 다시 시도해 주세요.');
  const enc=new TextEncoder(),salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),secret=enc.encode(newPassword);
  const material=await crypto.subtle.importKey('raw',secret,'PBKDF2',false,['deriveKey']);secret.fill(0);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt']);
  const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:enc.encode('IMD-Lab:editor:v1')},key,clearPayload);
  const as64=buf=>{const a=new Uint8Array(buf);let out='';for(let i=0;i<a.length;i+=8192)out+=String.fromCharCode(...a.subarray(i,i+8192));return btoa(out)};
  const next=JSON.stringify({salt:as64(salt),iv:as64(iv),cipher:as64(cipher)});
  const begin=m.index+m[0].indexOf(m[1]);return lockedPage.slice(0,begin)+next+lockedPage.slice(begin+m[1].length);
}
function addRotation(clearPayload){
  const opener=document.createElement('button');opener.type='button';opener.className='button secondary';opener.textContent='암호 변경';
  document.querySelector('.editor-header').append(opener);
  const dialog=document.createElement('dialog');dialog.className='dialog';dialog.setAttribute('aria-labelledby','rotate-title');
  dialog.innerHTML=`<form id="rotate-form"><h2 id="rotate-title">편집기 암호 변경</h2><p>새 암호를 정한 뒤 아래 버튼을 눌러 교체할 파일을 받으세요.</p><p><label>새 암호<br><input type="password" id="rotate-next" required minlength="8" autocomplete="new-password" spellcheck="false"></label></p><p><label>새 암호 확인<br><input type="password" id="rotate-again" required minlength="8" autocomplete="new-password" spellcheck="false"></label></p><p id="rotate-status" role="status" aria-live="polite"></p><div class="toolbar"><button type="submit" class="button">새 editor.html 받기</button><button type="button" class="button secondary" id="rotate-close">닫기</button></div><p style="margin-top:1em"><a href="https://github.com/imd-group/imd-group.github.io/upload/main/dist" target="_blank" rel="noopener noreferrer">GitHub 업로드 화면 열기 ↗</a></p></form>`;
  document.body.append(dialog);
  const form=dialog.querySelector('form'),first=form.querySelector('#rotate-next'),second=form.querySelector('#rotate-again'),note=form.querySelector('#rotate-status'),save=form.querySelector('[type=submit]');
  let taskId=0;
  opener.onclick=()=>{form.reset();note.textContent='GitHub에 파일을 올리고 배포가 끝나야 새 암호가 적용됩니다.';dialog.showModal();first.focus()};
  form.querySelector('#rotate-close').onclick=()=>dialog.close();dialog.addEventListener('close',()=>{taskId++;form.reset();save.disabled=false;});
  form.addEventListener('submit',async event=>{
    event.preventDefault();if(save.disabled)return;
    if(first.value!==second.value){note.textContent='두 암호가 다릅니다. 다시 입력해 주세요.';second.focus();return}
    if(first.value.length<8||first.value!==first.value.trim()){note.textContent='새 암호는 앞뒤 공백 없이 8자 이상 입력해 주세요.';first.focus();return}
    const id=++taskId,pw=first.value;save.disabled=true;note.textContent='파일을 만드는 중입니다…';
    try{
      const res=await fetch(location.pathname,{cache:'no-store',credentials:'same-origin'});if(!res.ok)throw new Error('현재 편집기 파일을 불러오지 못했습니다.');
      const html=await makeRotatedEditor(await res.text(),envelope,clearPayload,pw);if(id!==taskId||!dialog.open)return;
      const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='editor.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
      form.reset();note.textContent='파일을 받았습니다. 이름이 editor.html인지 확인하고 GitHub의 dist 폴더에 올린 뒤 Commit changes를 누르세요.';
    }catch(err){if(id===taskId)note.textContent=err.message||'파일을 만들지 못했습니다.';}finally{if(id===taskId)save.disabled=false;}
  });
}

let busy=false,opened=false;
window.addEventListener('pageshow',e=>{if(e.persisted&&opened)location.reload()});
if(window.isSecureContext&&crypto.subtle){submit.disabled=false}else{status.textContent='HTTPS와 최신 브라우저에서 열어 주세요.'}
show.onclick=()=>{const visible=input.type==='password';input.type=visible?'text':'password';show.textContent=visible?'암호 숨기기':'암호 표시';show.setAttribute('aria-pressed',String(visible));input.focus()};
byId('unlock').addEventListener('submit',async e=>{
  e.preventDefault();if(busy||submit.disabled)return;busy=true;submit.disabled=true;status.textContent='확인 중…';
  let plain;
  try{
    const enc=new TextEncoder(),secret=enc.encode(input.value.trim());input.value='';
    const material=await crypto.subtle.importKey('raw',secret,'PBKDF2',false,['deriveKey']);secret.fill(0);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(envelope.salt),iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
    plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(envelope.iv),additionalData:enc.encode('IMD-Lab:editor:v1')},key,bytes(envelope.cipher));
  }catch{status.textContent='암호가 올바르지 않습니다. 다시 입력해 주세요.';busy=false;submit.disabled=false;input.focus();return}
  try{
    const clearPayload=new Uint8Array(plain);const source=JSON.parse(new TextDecoder().decode(clearPayload));
    const doc=new DOMParser().parseFromString(source.html,'text/html');doc.querySelectorAll('script').forEach(n=>n.remove());
    const stylesheet=doc.querySelector('link[rel="stylesheet"]');
    if(stylesheet){const link=document.importNode(stylesheet,true);await new Promise((resolve,reject)=>{link.onload=resolve;link.onerror=()=>{link.remove();reject(new Error('style'))};document.head.append(link)})}
    document.title=doc.title;document.documentElement.lang=doc.documentElement.lang;
    document.body.replaceWith(document.importNode(doc.body,true));byId('gate-style').remove();opened=true;
    addRotation(clearPayload);
    const lock=document.createElement('button');lock.type='button';lock.textContent='편집기 잠금';lock.className='button secondary';lock.onclick=()=>location.reload();document.querySelector('.editor-header').append(lock);
    const script=document.createElement('script');script.type='module';script.textContent=source.js;script.onerror=()=>{const s=byId('status');if(s)s.textContent='편집기 파일을 불러오지 못했습니다. 새로고침 후 다시 열어 주세요.'};document.body.append(script);
  }catch{status.textContent='편집기를 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.';busy=false;submit.disabled=false}
});
